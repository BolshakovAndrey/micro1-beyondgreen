  one_sentence_summary: "An evidence-backed verify-existing workflow for deciding whether immutable React state-to-signals candidates are safe to merge despite incomplete legacy tests."
  rename_scope: "Marketing rename only; proven v1 scope remains React state to signals."
user:
  persona: "Frontend engineer migrating mature React code with green but potentially incomplete legacy tests."
  bottleneck: "A candidate can compile and pass visible tests while violating an untested behavioral, ordering, identity, lifecycle, subscription, or rollback invariant."
  practical_value: "Make accurate merge decisions and block false-green migrations with reproducible evidence."
workflow:
  scored_mode: "verify-existing"
  realistic_scenario: "Verify an already-existing immutable synthetic migration candidate by inventorying risk, running visible tests and additional contracts, and returning an independent evidence-backed verdict."
  usable_output: "Immutable candidate identity, risk inventory, check results, accept/reject/abstain verdict, schema-valid JSON, static HTML, and resource metadata."
  candidate_mutable_during_scored_run: false
baseline:
  description: "Status quo accepts when compilation and visible legacy tests are green, without additional probes, contracts, or risk inventory."
  fairness_rationale: "Status quo and BeyondGreen receive exactly the same 20 immutable candidates, visible inputs, environment, compilation, tests, scoring, limits, and one official attempt."
agent_solution:
  necessity: "Green legacy tests alone cannot reveal omitted behavior contracts; risk-directed independent verification can."
  capabilities:
    - "single BeyondGreen orchestrator"
    - "immutable candidate ingestion and hash checking"
    - "TypeScript Compiler API risk inventory"
    - "risk-linked additional probes and contracts"
    - "oracle-free jsdom internal checker plus physically isolated post-decision evaluator with K=0 feedback"
    - "provider-neutral reasoning adapter"
    - "offline evidence replay"
    - "fail-closed accept/reject/abstain policy"
    - "CLI, schema-validated JSON, and static HTML"
evaluation:
  version: "eval-v1.1.0"
  primary_metric: "Decision accuracy over 20 fixed candidate decisions"
  primary_metric_direction: "higher_is_better"
  success_threshold: "BeyondGreen >=16/20 accuracy, >=6/20 advantage over status quo, >=8/10 defect recall, <=2/10 false alarms, and >=18/20 completion."
  minimum_case_count: 10
  development_fixture_count: 4
  held_out_fixture_count: 6
  candidates_per_fixture: 2
  total_decisions: 20
  scored_attempts_per_candidate_per_arm: 1
  max_official_candidate_run_seconds: 180
  verifier_repair_rounds: 0
  status_quo_construction_control: "All 20 candidates must compile and pass visible tests; status quo must therefore score exactly 10/20 or the run is invalid."
  challenging_case_ids: []
  challenging_case_status: "must_be_assigned_and_frozen_before_fixture_code"
data:
  source: "Ten independently authored synthetic behavior specifications, each with one preserving and one seeded false-green candidate."
  license_or_permission: "Project-authored prose plus recorded public anchors; exact signals package/version/license freezes before fixtures."
  privacy_classification: "public_or_synthetic"
safety:
  consequential_actions: false
  human_review_required: true
  boundaries:
    - "Synthetic fixtures and immutable candidates only."
    - "No proprietary code, tests, data, identifiers, structures, traces, screenshots, or private documentation."
    - "No hidden-oracle mount or feedback to scored arms."
    - "Timeout, failed probe, nondeterminism, ambiguity, or incomplete evidence produces abstain and blocks merge."
    - "One D01 repair demo is allowed only after verdict and explicit human approval and remains unscored."
  archive_oracle_policy: "Arm-visible and verifier-only packages both ship for reproduction; runtime capabilities deny scored-arm access to verifier-only paths."
