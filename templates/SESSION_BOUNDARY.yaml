schema_version: "1.1"
session_id: "REQUIRED"
started_at_utc: "REQUIRED"
agent:
  tool: "REQUIRED"
  model: "REQUIRED"
  purpose: "REQUIRED"
context:
  repository_root: "REQUIRED"
  allowed_paths: []
  public_sources: []
  inherited_private_transcript: false
  additional_workspace_roots: []
  mcp_resources_enabled: []
  external_capabilities:
    filesystem_read_surface: "capability_exposed|not_exposed|not_verified"
    external_private_workspace_state: "state_not_inspected|inspected"
    browser_automation: "capability_exposed|not_exposed|not_verified"
    browser_private_state: "state_not_inspected|inspected"
    connected_apps: "capability_exposed|not_exposed|not_verified"
    connected_app_state: "state_not_inspected|inspected"
    private_mcp_state: "state_not_inspected|inspected"
    global_memory_state: "state_not_inspected|inspected"
    use_policy: "use_unauthorized|public_only|task_authorized"
  private_environment_variables_present:
    - "MICRO1_PRIVATE_DENYLIST"
    - "MICRO1_PRIVATE_TRACE_DIR"
controls:
  cleanroom_policy_read: false
  trace_policy_read: false
  challenge_contract_read: false
  private_denylist_available_to_scanner_only: false
  private_paths_resolve_outside_repository: false
  raw_trace_location: "external_local_only"
attestation:
  submission_eligible_at_start: false
  submission_eligible_after_boundary: false
  repository_artifacts_status: "candidate_pending_human_review"
  authoring_transcript_status: "eligible|excluded|pending_review"
  authoring_transcript_exclusion_category: ""
human_approval:
  status: "pending|approved|rejected"
  approver: ""
  approved_at_utc: ""
  approval_evidence: ""
