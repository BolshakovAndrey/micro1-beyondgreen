<svg xmlns="http://www.w3.org/2000/svg" width="640" height="678" viewBox="0 0 640 678" role="img" aria-labelledby="title desc">
  <title id="title">От зелёных тестов к проверяемому решению</title>
  <desc id="desc">Исследовать код — Неизменный код + доступные контракты — Риски и план поведенческих проверок; Зафиксировать вердикт — Принять / отклонить / воздержаться — Без подсказок от скрытой оценки; Оценить независимо — Две изолированные записи поведения — Отдельный оценщик + замороженный эталон; Сохранить доказательства — JSON с хешами + читаемый HTML — Повторная проверка без сети</desc>
  <rect x="1" y="1" width="638" height="676" rx="20" fill="#f5f8f6" stroke="#d7e2db"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <text x="32" y="41" fill="#36624d" font-size="15" font-weight="700" letter-spacing="1.4">BEYONDGREEN / ПРОЦЕСС ПРОВЕРКИ</text>

  <circle cx="45" cy="94" r="17" fill="#dcece2"/>
  <text x="45" y="100" text-anchor="middle" fill="#24553c" font-size="16" font-weight="700">01</text>
  <rect x="82" y="66" width="526" height="110" rx="12" fill="#ffffff" stroke="#d7e2db"/>
  <text x="106" y="99" fill="#173e2e" font-size="24" font-weight="700">Исследовать код</text>
  <text x="106" y="131" fill="#445950" font-size="20">Неизменный код + доступные контракты</text>
  <text x="106" y="158" fill="#445950" font-size="20">Риски и план поведенческих проверок</text>
<path d="M45 115 V186 m-4 -4 4 4 4 -4" fill="none" stroke="#91ad9d" stroke-width="2"/>
  <circle cx="45" cy="228" r="17" fill="#dcece2"/>
  <text x="45" y="234" text-anchor="middle" fill="#24553c" font-size="16" font-weight="700">02</text>
  <rect x="82" y="200" width="526" height="110" rx="12" fill="#ffffff" stroke="#d7e2db"/>
  <text x="106" y="233" fill="#173e2e" font-size="24" font-weight="700">Зафиксировать вердикт</text>
  <text x="106" y="265" fill="#445950" font-size="20">Принять / отклонить / воздержаться</text>
  <text x="106" y="292" fill="#445950" font-size="20">Без подсказок от скрытой оценки</text>
<path d="M45 249 V364 m-4 -4 4 4 4 -4" fill="none" stroke="#91ad9d" stroke-width="2"/>
  <circle cx="45" cy="406" r="17" fill="#dcece2"/>
  <text x="45" y="412" text-anchor="middle" fill="#24553c" font-size="16" font-weight="700">03</text>
  <rect x="82" y="378" width="526" height="110" rx="12" fill="#ffffff" stroke="#d7e2db"/>
  <text x="106" y="411" fill="#173e2e" font-size="24" font-weight="700">Оценить независимо</text>
  <text x="106" y="443" fill="#445950" font-size="20">Две изолированные записи поведения</text>
  <text x="106" y="470" fill="#445950" font-size="20">Отдельный оценщик + замороженный эталон</text>
<path d="M45 427 V498 m-4 -4 4 4 4 -4" fill="none" stroke="#91ad9d" stroke-width="2"/>
  <circle cx="45" cy="540" r="17" fill="#dcece2"/>
  <text x="45" y="546" text-anchor="middle" fill="#24553c" font-size="16" font-weight="700">04</text>
  <rect x="82" y="512" width="526" height="110" rx="12" fill="#173e2e" stroke="#173e2e"/>
  <text x="106" y="545" fill="#ffffff" font-size="24" font-weight="700">Сохранить доказательства</text>
  <text x="106" y="577" fill="#dbede2" font-size="20">JSON с хешами + читаемый HTML</text>
  <text x="106" y="604" fill="#dbede2" font-size="20">Повторная проверка без сети</text>

  <path d="M82 340 H608" stroke="#b7a97b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="86" y="325" width="516" height="30" rx="15" fill="#eee9dc"/>
  <text x="344" y="345" text-anchor="middle" fill="#64532a" font-size="18" font-weight="600">Вердикт зафиксирован · эталон изолирован</text>
  <text x="320" y="654" text-anchor="middle" fill="#526a5e" font-size="18">В оцениваемом запуске код не исправляется</text>
  </g>
</svg>
